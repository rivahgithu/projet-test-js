<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img src="src/logo.jpg" alt="" class="logo-wiki">

    <h1>Rechecher un article sur <span>Wikipedia</span></h1>

    <form>
     <input type="text" class="recherche" 
     placeholder="Rechercher un sujet">
     <button>Rechecher</button>
    </form>
    
    <p class="message-erreur"></p>
    <div class="cont-resultat">
        <div class="resultat">Salut, que recherche tu ?</div>
    </div>

    <div class="loader">
        <div class="rond"></div>
        <div class="rond"></div>
        <div class="rond"></div>
    </div>


    <script src="app.js"></script>
</body>
</html>
