<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
      <h1>🏴󠁧󠁢󠁳󠁣󠁴󠁿 Pays <span>Quizz</span></h1>

      <div class="container">
        <form class="quizz-form">
            <div class="container-question">
                <div class="box-question">
                    <h4>Quelle est la capitale de la France ?</h4>
                    <div>
                        <input type="radio" name="q1" id="toulouse" value="a" checked>
                        <label for="toulouse">Toulouse</label>
                    </div>
                    <div>
                        <input type="radio" name="q1" id="paris" value="b">
                        <label for="paris">Paris</label>
                    </div>
                    <div>
                        <input type="radio" name="q1" id="monaco" value="c">
                        <label for="monaco">Monaco</label>
                    </div>
                    <div>
                        <input type="radio" name="q1" id="londres" value="d">
                        <label for="londres">Londre</label>
                    </div>
                </div> 

                <div class="box-question">
                    <h4>Quelle est la capitale du Ghana ?</h4>
                    <div>
                        <input type="radio" name="q2" id="takoradi" value="a" checked>
                        <label for="takoradi">Takoradi</label>
                    </div>
                    <div>
                        <input type="radio" name="q2" id="kumasi" value="b">
                        <label for="kumasi">Kumasi</label>
                    </div>
                    <div>
                        <input type="radio" name="q2" id="accra" value="c">
                        <label for="accra">Accra</label>
                    </div>
                    <div>
                        <input type="radio" name="q2" id="tamale" value="d">
                        <label for="tamale">Tamale</label>
                    </div>
                </div> 

                <div class="box-question">
                    <h4>Quelle est la capitale de la Côte d'Ivoire ?</h4>
                    <div>
                        <input type="radio" name="q3" id="dabou" value="a" checked>
                        <label for="dabou">Dabou</label>
                    </div>
                    <div>
                        <input type="radio" name="q3" id="abidjan" value="b">
                        <label for="abidjan">Abidjan</label>
                    </div>
                    <div>
                        <input type="radio" name="q3" id="gagnoa" value="c">
                        <label for="gagnoa">Gagnoa</label>
                    </div>
                    <div>
                        <input type="radio" name="q3" id="yamoussokro" value="d">
                        <label for="yamoussokro">Yamoussokro</label>
                    </div>
                </div> 

                <div class="box-question">
                    <h4>Quelle est la capitale du Chili ?</h4>
                    <div>
                        <input type="radio" name="q4" id="iquique" value="a" checked>
                        <label for="iquique">Iquique</label>
                    </div>
                    <div>
                        <input type="radio" name="q4" id="valâraiso" value="b">
                        <label for="valâraiso">Valâraiso</label>
                    </div>
                    <div>
                        <input type="radio" name="q4" id="santiago" value="c">
                        <label for="santiago">Santiago</label>
                    </div>
                    <div>
                        <input type="radio" name="q4" id="vina-del-mar" value="d">
                        <label for="vina-del-mar">Vina del mar</label>
                    </div>
                </div> 

                <div class="box-question">
                    <h4>Quelle est la capitale de l'Allemagne ?</h4>
                    <div>
                        <input type="radio" name="q5" id="munich" value="a" checked>
                        <label for="munich">Munich</label>
                    </div>
                    <div>
                        <input type="radio" name="q5" id="berlin" value="b">
                        <label for="berlin">Berlin</label>
                    </div>
                    <div>
                        <input type="radio" name="q5" id="porto" value="c">
                        <label for="porto">Porto</label>
                    </div>
                    <div>
                        <input type="radio" name="q5" id="dublin" value="d">
                        <label for="dublin">Dublin</label>
                    </div>
                </div> 

                <div class="box-question">
                    <h4>Quelle est la capitale de la Perou ?</h4>
                    <div>
                        <input type="radio" name="q6" id="puno" value="a" checked>
                        <label for="puno">Puno</label>
                    </div>
                    <div>
                        <input type="radio" name="q6" id="paita" value="b">
                        <label for="paita">Paita</label>
                    </div>
                    <div>
                        <input type="radio" name="q6" id="lima" value="c">
                        <label for="lima">lima</label>
                    </div>
                    <div>
                        <input type="radio" name="q6" id="iquitos" value="d">
                        <label for="iquitos">Iquitos</label>
                    </div>
                </div> 
                   
            </div>
            <div class="resultat">
                <button type="submit" >Valider vos réposes</button>
                <h2>Validez vos réponses pour voir le résultat</h2>
                <p class="score"></p>
                <p class="info"></p>
            </div>
        </form>
      </div>

      <script src="app.js"></script>
</body>
</html>
